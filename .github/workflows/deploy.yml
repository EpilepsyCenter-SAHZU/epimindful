name: Build and Deploy
on:
  push:
    branches: [ main ]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0' 

      - name: Install dependencies
        run: npm install

      - name: Build project 
        run: npm run export 

      - name: Deploy to EdgeOne Pages
        run: npx edgeone pages deploy ./out -n epimindful -t ${{ secrets.EDGEONE_API_TOKEN }}
